<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Recipe Finder</title>
<style>body{font-family:system-ui;background:#0f1117;color:#f4f4f5;padding:2rem;max-width:800px;margin:auto}input{width:100%;padding:.7rem;border-radius:8px;border:1px solid #2e3240;background:#181b24;color:#fff;margin-bottom:1rem}.card{background:#181b24;border:1px solid #2e3240;border-radius:10px;padding:1rem;margin-bottom:.75rem}strong{color:#f97316}</style></head><body>
<h1>Recipe Finder</h1><input id="q" placeholder="Filter by ingredient (e.g. paneer, tomato, pasta)..." oninput="render()"><div id="list"></div>
<script>const RECIPES=[{name:"Paneer Tikka Bowl",tags:["paneer","yogurt","spices"],time:"25 min"},{name:"Garlic Tomato Pasta",tags:["pasta","tomato","garlic"],time:"20 min"},{name:"Masala Oats",tags:["oats","peas","tomato"],time:"12 min"},{name:"Avocado Toast",tags:["bread","avocado","lemon"],time:"8 min"}];
function render(){const k=document.getElementById("q").value.toLowerCase();document.getElementById("list").innerHTML=RECIPES.filter(r=>r.name.toLowerCase().includes(k)||r.tags.some(t=>t.includes(k))).map(r=>`<div class="card"><strong>${r.name}</strong> (${r.time})<div>Ingredients: ${r.tags.join(", ")}</div></div>`).join("")||"No matching recipes.";}render();</script></body></html>
