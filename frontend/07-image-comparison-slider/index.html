<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Image Comparison Slider</title>
<style>body{font-family:system-ui;background:#0f1117;color:#fff;padding:2rem;text-align:center}.wrap{position:relative;width:520px;height:280px;margin:1rem auto;border-radius:12px;overflow:hidden;border:1px solid #2e3240}.layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800}.before{background:linear-gradient(135deg,#1e293b,#334155)}.after{background:linear-gradient(135deg,#f97316,#ea580c);clip-path:inset(0 50% 0 0)}input{width:520px}</style></head><body>
<h1>Before / After Comparison Slider</h1><div class="wrap"><div class="layer before">BEFORE</div><div class="layer after" id="aft">AFTER</div></div>
<input type="range" min="0" max="100" value="50" oninput="aft.style.clipPath=`inset(0 ${100-this.value}% 0 0)`"></body></html>
