<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>EMI Calculator</title>
<style>body{font-family:system-ui;background:#0f1117;color:#fff;padding:2rem;max-width:520px;margin:auto}input{width:100%;padding:.6rem;margin:.35rem 0;background:#181b24;color:#fff;border:1px solid #2e3240;border-radius:8px}#out{margin-top:1rem;background:#181b24;padding:1rem;border-radius:10px;border-left:3px solid #f97316}</style></head><body>
<h1>Loan & EMI Calculator</h1>Principal (₹)<input id="p" type="number" value="500000" oninput="calc()">Annual Rate (%)<input id="r" type="number" value="9" step="0.1" oninput="calc()">Tenure (Months)<input id="n" type="number" value="60" oninput="calc()"><div id="out"></div>
<script>function calc(){const P=+p.value,R=(+r.value)/1200,N=+n.value;const emi=R?(P*R*Math.pow(1+R,N))/(Math.pow(1+R,N)-1):P/N;const tot=emi*N;out.innerHTML=`<strong>Monthly EMI: ₹${emi.toFixed(0)}</strong><br>Total Interest: ₹${(tot-P).toFixed(0)}<br>Total Payment: ₹${tot.toFixed(0)}`;}calc();</script></body></html>
