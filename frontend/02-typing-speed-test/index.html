<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Typing Speed Test</title>
<style>body{font-family:system-ui;background:#0f1117;color:#f4f4f5;padding:2rem;max-width:760px;margin:auto}#prompt{background:#181b24;padding:1rem;border-radius:10px;line-height:1.6;margin-bottom:1rem}textarea{width:100%;height:110px;background:#181b24;color:#fff;border:1px solid #f97316;border-radius:8px;padding:.75rem;font-size:1rem}#stats{margin-top:1rem;color:#fdba74;font-weight:700}</style></head><body>
<h1>Typing Speed & WPM Test</h1><div id="prompt">Clean code is simple, readable, and built to evolve with real user feedback.</div>
<textarea id="inp" placeholder="Start typing here..." oninput="calc()"></textarea><div id="stats">WPM: 0 | Accuracy: 100%</div>
<script>let start=null;const target=document.getElementById("prompt").textContent;
function calc(){const v=document.getElementById("inp").value;if(!start&&v.length)start=Date.now();const mins=Math.max((Date.now()-(start||Date.now()))/60000,1/60);const wpm=Math.round((v.length/5)/mins);let ok=0;for(let i=0;i<v.length;i++)if(v[i]===target[i])ok++;const acc=v.length?Math.round(ok/v.length*100):100;document.getElementById("stats").textContent=`WPM: ${wpm} | Accuracy: ${acc}%`;}</script></body></html>
