<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Material Audio & Media App — RiseAhead</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #090d16; color: #f8fafc; display: flex; justify-content: center; padding: 28px 16px; }
    .wrap { width: 100%; max-width: 430px; background: #111827; border: 1px solid #1f2937; border-radius: 14px; padding: 22px; }
    h1 { margin: 0 0 6px; font-size: 1.45rem; color: #f97316; }
    .sub { margin: 0 0 14px; color: #94a3b8; font-size: 0.92rem; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .tag { background: #1e293b; color: #fb923c; padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; }
    .bar { display: flex; gap: 8px; margin-bottom: 12px; }
    input { flex: 1; background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 9px 12px; border-radius: 8px; }
    button { background: #f97316; color: #fff; border: none; padding: 9px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    button.danger { background: #dc2626; }
    .row { display: flex; justify-content: space-between; align-items: center; background: #0f172a; border: 1px solid #1e293b; border-radius: 10px; padding: 12px; margin-bottom: 8px; }
    .meta { color: #94a3b8; font-size: 0.8rem; margin-top: 2px; }
    .actions { display: flex; gap: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Material Audio & Media App</h1>
    <p class="sub">Clean material-design media browser with queue management and theming. (Mobile App Development)</p>
    <div class="tags"><span class="tag">Java/Kotlin</span><span class="tag">Android SDK</span></div>
    <div class="bar">
      <input id="newTitle" placeholder="Add a new item..." />
      <button id="addBtn">+ Add</button>
    </div>
    <div class="bar">
      <input id="search" placeholder="Filter records..." />
      <span id="count" class="meta" style="align-self:center;"></span>
    </div>
    <div id="list"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
